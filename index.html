<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Minutas</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="containerPrincipal">
        <div class="container">
            <h1>Generador de Minutas</h1>
            
            <form id="minutaForm">
                <div class="form-group">
                    <label for="tituloValor">#SI</label>
                    <input type="text" id="tituloValor" required>
                </div>
                
                <div class="form-group">
                    <label for="numeroProyecto">Solution Identifier (SI)</label>
                    <input type="text" id="numeroProyecto" required>
                </div>
                
                <div class="form-group">
                    <label for="nombreProyecto">Nombre del proyecto:</label>
                    <input type="text" id="nombreProyecto" required>
                </div>
                
                <div class="form-group">
                    <label for="descripcion">Descripción breve:</label>
                    <textarea id="descripcion" rows="3" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="arquitecto">Nombre del Arquitecto:</label>
                    <input type="text" id="arquitecto" required>
                </div>
                
                <div class="form-group">
                    <label for="solicitante">Solicitante:</label>
                    <input type="text" id="solicitante" required>
                </div>
                
                <div class="form-group">
                    <label for="observaciones">Observaciones:</label>
                    <textarea id="observaciones" rows="3"></textarea>
                </div>
                
                <!--Sección de preguntas de sección múltiple-->
                <div class="form-group radio-group">
                    <label>1. Reportes de Vulnerabilidades
                        <br>
                        a. Rapid7
                    </label>
                    <div>
                        <input type="radio" id="aplicaRapid7" name="rapid7" value="Sí aplica" checked>
                        <label for="aplicaRapid7Si">Sí aplica</label>
                    </div>
                    <div>
                        <input type="radio" id="aplicaRapid7No" name="rapid7" value="No aplica">
                        <label for="aplicaRapid7No">No aplica</label>
                    </div>
                </div>
                
                <div class="form-group radio-group">
                    <label>b. Prisma</label>
                    <div>
                        <input type="radio" id="aplicaPrismaSi" name="prisma" value="Sí aplica" checked>
                        <label for="aplicaPrismaSi">Sí aplica</label>
                    </div>
                    <div>
                        <input type="radio" id="aplicaPrismaNo" name="prisma" value="No aplica">
                        <label for="aplicaPrismaNo">No aplica</label>
                    </div>
                </div>

                <!--Termina sección de preguntas-->

                <button type="button" id="generarBtn">Generar Minuta</button>
            </form>
        </div>

        <div class="minuta-container">
            <h2>Minuta Generada</h2>
            <div id="minutaOutput" class="minuta-output">
                <!-- Aquí está el template de la minuta que queremos formatear con CSS -->
                <p class="minuta-titulo" id="minutaTitulo">Minuta Semanal - SI [#]</p>
                <ul>
                    <li class="infoProyecto"><strong>Número de proyecto:</strong> <span id="minutaNumeroProyecto"></span></li>
                    <li class="infoProyecto"><strong>Nombre del proyecto:</strong> <span id="minutaNombreProyecto"></span></li>
                    <li class="infoProyecto"><strong>Descripción breve:</strong> <span id="minutaDescripcion"></span></li>
                    <li class="infoProyecto"><strong>Arquitecto:</strong> <span id="minutaArquitecto"></span></li>
                    <li class="infoProyecto"><strong>Solicitante:</strong> <span id="minutaSolicitante"></span></li>
                </ul>

                <p class="infoProyecto"><strong>Observaciones:</strong></p>
                    <div id="minutaObservaciones" class="minuta-observaciones"></div>
                
                <!--Preguntas con opción múltiple-->
                <p><strong>1. Reporte de Vulnerabilidades</strong></p>
                <p class="infoProyecto"><strong>Reporte Rapid7</strong> 
                <br>
                <span class="infoPreguntas" id="minutaAplicaRapid7"></span></p>

                <p><strong>Reporte Prisma</strong>
                <br>
                <span class="infoPreguntas" id="minutaAplicaPrisma"></span></p>

                <!--Firma en caso de ocuparse-->
                <!--<p class="minuta-firma">Atentamente,<br>El equipo de revisión</p>-->
            </div>
            <button id="copiarBtn">Copiar Minuta</button>
            <p class="advertenciaCopy"></p>
        </div>

    </div>
        
        <script src="./script/script.js"></script>
</body>
</html>
